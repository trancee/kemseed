name: CI

# Q1 repo gate (Constitution Q1 + AGENTS spotless skill): spotlessCheck (ktfmt
# kotlinlangStyle, ratchetFrom main) + JVM host tests + Kotlin/Native iOS compile.
#
# detekt is intentionally OMITTED from this gate: the io.detekt 1.23.8 Gradle-plugin
# marker is unresolvable on the Gradle Plugin Portal + Maven Central (303 -> dead
# `io/detekt` Maven-Central group; no `detekt-gradle-plugin` under `io.github.detekt`,
# and `detekt-cli` 1.23.8 404s too). This is an upstream publishing break, not a
# Gradle-9 or repo-config issue (Gradle itself fails at resolution, not configuration).
# Re-enable `:detekt` (+ a `detekt {}` block + the version/alias in
# gradle/libs.versions.toml) once the marker is republished; see docs/adr/0003.
#
# GitHub Actions: SHA-pinned to latest stable for reproducible CI (Constitution E1).
# Re-pin the SHAs below whenever a new stable major ships (checkout@v7.0.1, setup-java@v6.0.1).

on:
  push:
  pull_request:

jobs:
  gate:
    name: Q1 gate (spotless + tests + iOS compile)
    runs-on: macos-14    # compileKotlinIos (KMP iOS) requires macOS + Xcode.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: 25      # mirrors org.gradle.jvm.toolchain=25 (gradle.properties)
      # Ensure the `main` ref exists. actions/checkout defaults to fetch-depth: 1, so
      # any run NOT on `main` (Dependabot/feature/PR branches) has no `main` ref and
      # Spotless's ratchetFrom("main") (build.gradle.kts:35) throws
      # "No such reference 'main'" at :spotlessKotlin task creation -> :spotlessCheck
      # fails (reproduced from GH run 35385527317). fetch-depth:1 of `main` is enough
      # since ratchetFrom only diffs against the base commit tree.
      # Only materialise `main` when ABSENT: on a push to `main` it is already the
      # checked-out branch, and `git fetch into a checked-out branch` is refused
      # ("fatal: refusing to fetch into branch 'refs/heads/main' ...", exit 128).
      - name: Ensure base 'main' ref exists for spotless ratchet
        run: git rev-parse --verify --quiet main >/dev/null || git fetch --no-tags --depth 1 origin main:main
      - name: :spotlessCheck     # read-only format gate; fail fast before tests compile
        run: ./gradlew :spotlessCheck --no-daemon --console=plain
      - name: :testAndroidHostTest + :compileKotlinIos
        run: ./gradlew :testAndroidHostTest :compileKotlinIos --no-daemon --console=plain
