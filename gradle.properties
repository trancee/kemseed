# Kotlin Multiplatform (Android + iOS) build for the hybrid isogeny-to-ML-KEM BLE mesh.
# Zero external runtime dependencies by policy (see docs/adr/0001-stack-and-dependency-constraints.md).
org.gradle.caching=true
org.gradle.jvm.toolchain=25
android.useAndroidX=true
android.enableJetifier=false
# ADR-0001: device-only iOS (arm64, no simulator). Disable the default KMP hierarchy
# template so naming the target `ios` does not clash with the template's `ios` group.
kotlin.mpp.applyDefaultHierarchyTemplate=false
